<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <header th:fragment="navbar"
        class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm transition-all">

        <!-- TODO TU NAVBAR -->

        <div class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20 gap-4">
                <div class="flex items-center gap-3 cursor-pointer flex-shrink-0"
                    onclick="window.location.href = '/index'">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-medical-blue to-blue-400 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-md">
                        ★
                    </div>
                    <span class="text-xl md:text-2xl font-black text-medical-dark tracking-tight hidden sm:block">Botica
                        Estrella</span>
                </div>

                <div class="flex-1 max-w-3xl w-full">

                    <div class="relative group flex items-center">

                        <!-- ICONO -->
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400 group-focus-within:text-medical-blue transition-colors"
                                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>

                        <!-- INPUT (IMPORTANTE: id agregado) -->
                        <input id="searchInput" type="search" name="buscar"
                            class="block w-full pl-12 pr-4 py-3 border-2 border-slate-100 rounded-full leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-4 focus:ring-medical-blue/10 focus:border-medical-blue transition-all font-medium"
                            placeholder="Buscar paracetamol, ibuprofeno, marcas..." />

                        <!-- BOTÓN (ya no envía formulario) -->
                        <button type="button"
                            class="absolute right-2 top-1.5 bottom-1.5 bg-medical-blue text-white px-5 rounded-full font-bold hover:bg-medical-dark transition-colors text-sm">
                            Buscar
                        </button>

                    </div>

                </div>

                <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                    <a href="/productos"
                        class="hidden lg:block text-slate-500 hover:text-medical-blue font-bold px-3 py-2 transition-colors">Catálogo</a>

                    <div sec:authorize="hasRole('ADMIN')">

                        <a href="/admin" class="px-4 py-2 rounded-xl bg-red-500 text-white font-bold">
                            Admin
                        </a>

                    </div>
                    <a href="/carrito"
                        class="relative p-2 text-slate-500 hover:text-medical-blue transition-colors group">
                        <svg class="w-7 h-7 group-hover:scale-110 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
                            </path>
                        </svg>
                        <span th:text="${cartCount}"
                            class="absolute top-0 right-0 inline-flex items-center justify-center w-5 h-5 text-[10px] font-bold text-white bg-red-500 border-2 border-white rounded-full"></span>
                    </a>

                    <div th:if="${#authorization.expression('isAuthenticated()')}" class="relative group">

                        <button
                            class="hidden md:inline-flex items-center justify-center px-6 py-2.5 rounded-full text-white bg-medical-blue hover:bg-medical-dark font-bold transition-all gap-2">

                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>

                            <span th:text="${#authentication.principal.nombre}">Usuario</span>

                        </button>

                        <!-- DROPDOWN -->
                        <div
                            class="absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50">

                            <a href="/perfil" class="block px-4 py-2 text-slate-700 hover:bg-slate-100">
                                Perfil
                            </a>

                            <form action="/logout" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="w-full text-left px-4 py-2 text-red-500 hover:bg-red-50">
                                    Cerrar sesión
                                </button>
                            </form>

                        </div>

                    </div>
                </div>
            </div>
        </div>
    </header>


</body>

</html>
