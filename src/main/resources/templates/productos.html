<!doctype html>
<html lang="es" class="bg-slate-50 scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Avanzado | Botica Estrella 2026</title>
  <link rel="icon" href="logo/botica_estrella-logo.ico" type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/js/filtroProducto.js}"></script>

  <!-- Colores Clínicos -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            medical: { blue: '#0d4d8b', dark: '#0a3663', light: '#f0f7ff', accent: '#2ecc71', border: '#e2e8f0' }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #0d4d8b;
      cursor: pointer;
      margin-top: -6px;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #cbd5e1;
      border-radius: 2px;
    }
  </style>
</head>

<body
  class="text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-medical-blue selection:text-white">

  <div th:replace="~{fragments/navbar :: navbar}"></div>
  <!-- ================= CUERPO: SIDEBAR + GRID ================= -->
  <main class="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-8 flex-grow">

    <!-- === PANEL LATERAL DE FILTROS (TECNOLÓGICO Y COMPLETO) === -->
    <aside class="w-full lg:w-72 flex-shrink-0">
      <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 sticky top-28">

        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
            <svg class="w-5 h-5 text-medical-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
              </path>
            </svg>
            Filtros
          </h2>
          <button id="btnLimpiar"
            class="text-xs font-bold text-slate-400 hover:text-medical-blue uppercase tracking-wide">Limpiar
            Todo</button>
        </div>

        <!-- 1. Categoría Principal -->
        <div class="mb-8">
          <h3 class="text-sm font-bold text-slate-800 mb-3">Categoría Principal</h3>
          <div class="relative">
            <select id="categoriaSelect"
              class="w-full bg-slate-50 border border-slate-200 text-slate-700 font-bold rounded-xl py-3 px-4 appearance-none outline-none focus:ring-2 focus:ring-medical-blue cursor-pointer">
              <option value="todos">Todos los Productos</option>
              <option value="medicamentos">Medicamentos</option>
              <option value="cuidado personal">Cuidado Personal</option>
              <option value="primeros auxilios">Primeros Auxilios</option>
              <option value="higiene">Higiene</option>
              <option value="equipo médico">Equipo Médico</option>
              <option value="suplemento">Suplemento</option>
              <option value="rehabilitación">Rehabilitación</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>
        </div>

        <hr class="border-slate-100 mb-6">

        <!-- 2. Rango de Precio -->
        <div class="mb-8">
          <h3 class="text-sm font-bold text-slate-800 mb-4 flex justify-between">
            Precio Máximo <span id="priceLabel" class="text-medical-blue font-black">S/. 100.00</span>
          </h3>
          <input type="range" id="priceRange" min="0" max="100" value="100" class="w-full outline-none">
          <div class="flex justify-between text-xs text-slate-400 font-bold mt-2">
            <span>S/. 0</span>
            <span>S/. 100+</span>
          </div>
        </div>

        <hr class="border-slate-100 mb-6">

        <!-- 3. Formato / Presentación -->
        <div class="mb-8">
          <h3 class="text-sm font-bold text-slate-800 mb-4">
            Presentación
          </h3>

          <div class="space-y-3" id="formatosContainer">

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="tableta"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Tabletas
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="jarabe"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Jarabes
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="crema"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Cremas
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="gel"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Geles
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="cápsula"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Cápsulas
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="unidad"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Unidades / Equipos
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="solución"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Solución
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="paquete"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Paquete
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="caja"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Cajas
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="gotas"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Gotas
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="botella"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Botellas
              </span>
            </label>

            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" value="pack"
                class="filtro-formato w-5 h-5 text-medical-blue rounded border-slate-300 focus:ring-medical-blue cursor-pointer">
              <span class="text-sm text-slate-600 font-medium group-hover:text-slate-900">
                Pack
              </span>
            </label>
          </div>
          <!-- 4. Marcas Destacadas -->
          <div>
            <h3 class="text-sm font-bold text-slate-800 mb-4">Marcas</h3>
            <div class="flex flex-wrap gap-2" id="marcasContainer">
              <button
                class="filtro-marca bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer transition-colors"
                data-marca="old spice">Old Spice</button>
              <button
                class="filtro-marca bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer transition-colors"
                data-marca="ninet plus">Ninet</button>
              <button
                class="filtro-marca bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer transition-colors"
                data-marca="bayer">Bayer</button>
              <button
                class="filtro-marca bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer transition-colors"
                data-marca="generico">Genérico</button>
            </div>
          </div>
        </div>
    </aside>

    <!-- === ÁREA DEL CATÁLOGO === -->
    <div class="flex-1">

      <!-- Top Bar: Resultados -->
      <div
        class="flex flex-col sm:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 gap-4">
        <p class="text-sm text-slate-500 font-medium" id="resultadosTexto">Mostrando todos los productos disponibles</p>
      </div>

      <!-- GRID DE PRODUCTOS (FÍJATE EN LOS DATA-ATTRIBUTES) -->
      <section id="productosGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
        <a th:href="@{/productos/{id}(id=${producto.id})}" th:each="producto : ${productos}"
          class="catalog-card bg-white rounded-[1.5rem] shadow-sm hover:shadow-xl transition-all border border-slate-200 flex flex-col group relative"
          th:data-categoria="${producto.categoria}" th:data-precio="${producto.precio}"
          th:data-formato="${producto.formato}" th:data-marca="${producto.marca}">

          <div class="p-6 flex justify-center items-center h-52 bg-slate-50/50 rounded-t-[1.5rem]">

            <img th:src="@{'/img/' + ${producto.imagen}}" th:alt="${producto.nombre}"
              class="max-h-36 object-contain group-hover:scale-110 transition-transform drop-shadow-md">

          </div>

          <div class="p-5 flex flex-col flex-grow border-t border-slate-100">

            <span class="text-[11px] font-black text-slate-400 mb-1 uppercase tracking-widest"
              th:text="${producto.categoria}">
            </span>

            <h3 class="product-title text-base font-bold text-slate-800 leading-snug mb-4 line-clamp-2"
              th:text="${producto.nombre}">
            </h3>

            <div class="flex items-center justify-between mt-auto">

              <span class="text-2xl font-black text-slate-900" th:text="'S/. ' + ${producto.precio}">
              </span>

              <button
                class="bg-slate-100 text-medical-blue hover:bg-medical-blue hover:text-white w-10 h-10 rounded-xl flex items-center justify-center transition-colors shadow-sm">
                +
              </button>

            </div>

          </div>

          </a>
      </section>

      <!-- Mensaje SIN RESULTADOS -->
      <div id="noResults" class="hidden flex-col items-center justify-center py-20 text-center">
        <h3 class="text-2xl font-black text-slate-800 mb-2">Oops! No encontramos coincidencias.</h3>
        <p class="text-slate-500">Prueba subiendo el precio máximo o cambiando de categoría.</p>
        <button onclick="document.getElementById('btnLimpiar').click()"
          class="mt-4 bg-medical-blue text-white px-6 py-2 rounded-full font-bold">Quitar Filtros</button>
      </div>

    </div>
  </main>

  <!-- ================= FOOTER CORPORATIVO ================= -->
   <div th:replace="~{fragments/footer :: footer}"></div>

  <script type="module" src="script.js"></script>
  <script src="filtroProducto.js"></script>

</body>

</html>
