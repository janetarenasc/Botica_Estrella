<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            blue: '#0d4d8b',
                            dark: '#0a3663',
                            light: '#f0f7ff',
                            accent: '#2ecc71',
                            border: '#e2e8f0'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <main class="w-full max-w-2xl mx-auto">

        <!-- HEADER -->
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-black text-slate-800">
                Nuevo Producto
            </h1>
            <p class="text-slate-500 mt-2">
                Registra un producto en el inventario de la botica
            </p>
        </div>

        <!-- FORM -->
        <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post"
            enctype="multipart/form-data" class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 space-y-6">

            <input type="hidden" th:field="*{id}">

            <!-- NOMBRE -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">Nombre del producto</label>
                <input type="text" th:field="*{nombre}"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-medical-blue/10 focus:border-medical-blue outline-none transition"
                    placeholder="Ej: Paracetamol 500mg">
            </div>

            <!-- PRECIO -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">Precio (S/.)</label>
                <input type="number" step="0.01" th:field="*{precio}"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-medical-blue/10 focus:border-medical-blue outline-none transition"
                    placeholder="0.00">
            </div>

            <!-- STOCK -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">Stock disponible</label>
                <input type="number" th:field="*{stock}"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-medical-blue/10 focus:border-medical-blue outline-none transition"
                    placeholder="0">
            </div>

            <!-- IMAGEN -->
            <div>
                <label class="block font-bold text-slate-700 mb-2">
                    Imagen del producto
                </label>

                <input type="file" name="file" accept="image/*"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-medical-blue file:text-white file:font-bold hover:file:bg-medical-dark">
            </div>

            <!-- BOTÓN -->
            <button type="submit"
                class="w-full bg-gradient-to-r from-medical-blue to-blue-500 hover:from-medical-dark hover:to-medical-blue text-white py-4 rounded-2xl font-black text-lg transition-transform hover:scale-[1.02] shadow-md">

                Guardar Producto

            </button>

        </form>

    </main>

</body>

</html>
