<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Compras | Botica Estrella</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            blue: '#0d4d8b',
                            dark: '#0a3663',
                            light: '#f0f7ff',
                            accent: '#2ecc71',
                            border: '#e2e8f0'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800">

    <main class="max-w-6xl mx-auto px-6 py-10 space-y-8">

        <!-- HEADER -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">

            <div>
                <h1 class="text-4xl font-black text-medical-dark">
                    Historial de Compras
                </h1>

                <p class="text-slate-500 mt-1">
                    Registro completo de transacciones realizadas.
                </p>
            </div>

            <div class="flex items-center gap-4">

                <div class="text-sm text-slate-400">
                    Botica Estrella • Sistema de ventas
                </div>

                <a th:href="@{/admin}"
                    class="bg-slate-700 text-white px-5 py-3 rounded-xl font-bold hover:bg-slate-800 transition">
                    ← Volver
                </a>

            </div>

        </div>
        <!-- EMPTY STATE -->
        <div th:if="${#lists.isEmpty(compras)}"
            class="bg-white border border-slate-200 rounded-3xl p-10 text-center shadow-sm">

            <div class="text-5xl mb-3">💊</div>

            <h2 class="text-xl font-black text-slate-800">
                No hay compras registradas
            </h2>

            <p class="text-slate-500 mt-2">
                Cuando los clientes compren productos, aparecerán aquí.
            </p>

        </div>

        <!-- LIST -->
        <div class="space-y-6">

            <div th:each="compra : ${compras}"
                class="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden hover:shadow-md transition">

                <!-- TOP BAR -->
                <div class="bg-medical-light px-6 py-4 flex justify-between items-center">

                    <div>
                        <p class="font-black text-medical-dark">
                            Cliente: <span th:text="${compra.usuario.nombre}"></span>
                        </p>

                        <p class="text-xs text-slate-500" th:text="${compra.fecha}">
                        </p>
                    </div>

                    <div class="text-right">
                        <p class="text-sm text-slate-500">Total</p>
                        <p class="text-2xl font-black text-medical-blue" th:text="'S/. ' + ${compra.total}">
                        </p>
                    </div>

                </div>

                <!-- BODY -->
                <div class="p-6">

                    <p class="text-sm font-bold text-slate-500 mb-3 uppercase tracking-wide">
                        Productos
                    </p>

                    <div class="space-y-2">

                        <div th:each="item : ${compra.detalles}" class="flex justify-between items-center text-sm">

                            <div class="text-slate-700 font-medium">
                                <span th:text="${item.producto.nombre}"></span>
                            </div>

                            <div class="flex gap-4 items-center text-slate-500">

                                <span class="bg-slate-100 px-3 py-1 rounded-full text-xs font-bold">
                                    x<span th:text="${item.cantidad}"></span>
                                </span>

                                <span class="font-black text-slate-800"
                                    th:text="'S/. ' + (${item.precio} * ${item.cantidad})">
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
